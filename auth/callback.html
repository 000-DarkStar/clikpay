<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion en cours...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .loader-container {
            text-align: center;
            color: white;
        }
        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            margin-bottom: 10px;
        }
        p {
            opacity: 0.9;
        }
        .error {
            background: #fff;
            color: #dc3545;
            padding: 20px;
            border-radius: 10px;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div class="loader-container" id="content">
        <h2>Redirection...</h2>
    </div>

    <script src="/assets/js/api.js"></script>
    <script>
        // Récupérer le token depuis l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const error = urlParams.get('error');

        if (error) {
            document.getElementById('content').innerHTML = `
                <div class="error">
                    <h2>❌ Erreur de connexion</h2>
                    <p>Une erreur est survenue lors de l'authentification Google.</p>
                    <p><a href="/login.html" style="color: #667eea;">Retour à la connexion</a></p>
                </div>
            `;
        } else if (token) {
            // Sauvegarder le token
            localStorage.setItem('clikpay_token', token);

            // Récupérer les infos utilisateur
            fetch(`${window.API_URL}/api/user/profile`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.user) {
                    localStorage.setItem('clikpay_user', JSON.stringify(data.user));
                }
                // Marquer comme nouvelle connexion pour afficher la notification
                sessionStorage.setItem('just_logged_in', 'true');
                // Rediriger vers le dashboard
                window.location.href = '/dashboard/dashboard.html';
            })
            .catch(err => {
                console.error('Error fetching user:', err);
                // Marquer quand même comme nouvelle connexion
                sessionStorage.setItem('just_logged_in', 'true');
                // Rediriger quand même vers le dashboard
                window.location.href = '/dashboard/dashboard.html';
            });
        } else {
            document.getElementById('content').innerHTML = `
                <div class="error">
                    <h2>❌ Token manquant</h2>
                    <p>Aucun token d'authentification reçu.</p>
                    <p><a href="/login.html" style="color: #667eea;">Retour à la connexion</a></p>
                </div>
            `;
        }
    </script>
</body>
</html>
