<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion en cours...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .loader-container {
            text-align: center;
            color: white;
        }
        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            margin-bottom: 10px;
        }
        p {
            opacity: 0.9;
        }
        .error {
            background: #fff;
            color: #dc3545;
            padding: 20px;
            border-radius: 10px;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div class="loader-container" id="content">
        <h2>Redirection...</h2>
    </div>

    <script>
        // Récupérer le token depuis l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const error = urlParams.get('error');

        if (error) {
            document.getElementById('content').innerHTML = `
                <div class="error">
                    <h2>❌ Erreur de connexion</h2>
                    <p>Une erreur est survenue lors de l'authentification OAuth.</p>
                    <p><a href="/login.html" style="color: #667eea;">Retour à la connexion</a></p>
                </div>
            `;
        } else if (token) {
            localStorage.setItem('clikpay_token', token);
            sessionStorage.setItem('just_logged_in', 'true');
            window.location.href = '/dashboard/dashboard.html';
        } else {
            document.getElementById('content').innerHTML = `
                <div class="error"><h2>Récupération de Discord...</h2></div>
            `;

            (async () => {
                try {
                    if (!window.supabase) throw new Error('SDK Supabase indisponible');
                    const client = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
                    let { data: sessionData } = await client.auth.getSession();

                    if (!sessionData?.session && urlParams.get('code')) {
                        const exchanged = await client.auth.exchangeCodeForSession(urlParams.get('code'));
                        sessionData = exchanged.data;
                        if (exchanged.error) throw exchanged.error;
                    }

                    const supabaseAccessToken = sessionData?.session?.access_token;
                    if (!supabaseAccessToken) throw new Error('Session Discord introuvable');

                    const response = await fetch(`${window.API_URL}/auth/discord/session`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({supabaseAccessToken})
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error || 'Erreur Discord');

                    localStorage.setItem('clikpay_token', result.token);
                    localStorage.setItem('clikpay_user', JSON.stringify(result.user));
                    sessionStorage.setItem('just_logged_in', 'true');
                    window.location.href = '/dashboard/dashboard.html';
                } catch (err) {
                    console.error(err);
                    document.getElementById('content').innerHTML = `
                        <div class="error">
                            <h2>❌ Erreur Discord</h2>
                            <p>${err.message}</p>
                            <p><a href="/login.html" style="color: #667eea;">Retour à la connexion</a></p>
                        </div>
                    `;
                }
            })();
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/umd/supabase.js"></script>
</body>
</html>
