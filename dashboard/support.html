<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support — clik.pay</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="dashboard.css">
<script>try{document.documentElement.setAttribute('data-theme', localStorage.getItem('cp-theme')||'dark')}catch(e){}</script>
</head>
<body><div class="bg-layer"></div><div class="shell">
<aside id="sidebar">
  <div class="side-brand"><i class="fa-solid fa-lock"></i><img class="side-logo side-logo-dark" src="../assets/img/logo-white.svg" alt="clik.pay"><img class="side-logo side-logo-light" src="../assets/img/logo-black.svg" alt="clik.pay"></div>
  <nav class="side-nav">
    <a class="side-link" href="dashboard.html"><i class="fa-solid fa-gauge"></i> Tableau de bord</a>
    <a class="side-link" href="links.html"><i class="fa-solid fa-link"></i> Mes liens</a>
    <a class="side-link" href="stats.html"><i class="fa-solid fa-chart-line"></i> Statistiques</a>
    <a class="side-link" href="payments.html"><i class="fa-solid fa-wallet"></i> Paiements</a>
    <a class="side-link active" href="support.html"><i class="fa-solid fa-headset"></i> Support</a>
    <a class="side-link" href="settings.html"><i class="fa-solid fa-gear"></i> Réglages</a>
  </nav>
  <div class="side-foot"><a class="side-link" href="#" id="logoutLink"><i class="fa-solid fa-arrow-right-from-bracket"></i> Déconnexion</a></div>
</aside>
<main id="main">
  <div class="topbar"><div><div class="page-title">Support</div><div class="page-sub">Créez un ticket ou consultez vos conversations.</div></div><div class="topbar-right"><div class="user-pill"><div class="avatar"></div><span>Chargement...</span></div></div></div>
  <div class="grid-2">
    <div class="panel"><div class="panel-head"><h3>Nouveau ticket</h3></div>
      <div class="field"><label>Catégorie</label><select id="ticketCategory"><option value="technical">Problème technique</option><option value="account">Problème de compte</option><option value="login">Problème de connexion</option><option value="link">Problème avec un lien</option><option value="revenue">Problème de rémunération</option><option value="payment">Paiement</option><option value="report">Signalement</option><option value="other">Autre</option></select></div>
      <div class="field"><label>Sujet</label><input id="ticketSubject" type="text" maxlength="160"></div>
      <div class="field"><label>Message</label><textarea id="ticketMessage" rows="7" style="resize:vertical"></textarea></div>
      <button id="createTicketBtn" class="btn btn-solid">Envoyer le ticket</button>
    </div>
    <div class="panel"><div class="panel-head"><h3>Mes tickets</h3></div><div id="ticketList" class="empty-state"><i class="fa-solid fa-headset"></i><p>Chargement des tickets...</p></div></div>
  </div>
</main></div>
<script src="../assets/js/api.js"></script><script src="../assets/js/dashboard-common.js"></script><script src="support.js"></script>
</body></html>
