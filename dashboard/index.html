<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — clik.pay</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="../assets/img/favicon.svg">
<script src="../assets/js/notifications.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: 'Inter', sans-serif;
  background: #0a0a0a;
  color: #fff;
  min-height: 100vh;
}
.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px;
}
h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 2em;
  margin-bottom: 30px;
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  margin-bottom: 40px;
}
.stat-card {
  background: #1a1a1a;
  padding: 25px;
  border-radius: 12px;
  border: 1px solid #333;
}
.stat-card h3 {
  font-size: 0.9em;
  color: #888;
  margin-bottom: 10px;
  font-weight: 500;
}
.stat-card .value {
  font-size: 2em;
  font-weight: 600;
  color: #667eea;
}
.welcome {
  background: #1a1a1a;
  padding: 30px;
  border-radius: 12px;
  border: 1px solid #333;
  margin-bottom: 30px;
}
.btn {
  display: inline-block;
  padding: 12px 24px;
  background: #667eea;
  color: white;
  text-decoration: none;
  border-radius: 8px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: background 0.3s;
}
.btn:hover {
  background: #5568d3;
}
</style>
</head>
<body>
<div class="container">
  <h1>🎯 Tableau de bord</h1>

  <div class="welcome">
    <h2 id="userName">Bienvenue !</h2>
    <p style="color: #888; margin-top: 10px;">Vous êtes connecté et prêt à créer vos liens.</p>
    <button class="btn" style="margin-top: 20px;">Créer un lien</button>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <h3>Liens créés</h3>
      <div class="value">0</div>
    </div>
    <div class="stat-card">
      <h3>Clics total</h3>
      <div class="value">0</div>
    </div>
    <div class="stat-card">
      <h3>Revenus</h3>
      <div class="value">0,00 €</div>
    </div>
    <div class="stat-card">
      <h3>Taux de conversion</h3>
      <div class="value">0%</div>
    </div>
  </div>
</div>

<script>
// Vérifier l'authentification
const token = localStorage.getItem('clikpay_token');
if (!token) {
  window.location.href = '/login.html';
}

// Afficher le nom de l'utilisateur
const user = JSON.parse(localStorage.getItem('clikpay_user') || '{}');
if (user.firstName) {
  document.getElementById('userName').textContent = `Bienvenue ${user.firstName} !`;
}
</script>
</body>
</html>
