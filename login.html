<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — clik.pay</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/auth.css">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="/assets/js/api.js"></script>
</head>
<body>
<div class="split">

  <aside class="hero">
    <a class="brand-logo" href="index.html"><img src="assets/img/logo-black.svg" alt="clik.pay"></a>
    <div class="hero-bottom">
      <div class="kicker"><i class="fa-regular fa-shield-halved"></i> Fait pour les créateurs</div>
      <h1>Tes liens t'attendent.</h1>
      <p>Crée des liens, partage-les et suis tes gains en un seul endroit.</p>
      <div class="steps">
        <div class="step on"><span class="n"><i class="fa-solid fa-check"></i></span>Connexion sécurisée</div>
        <div class="step"><span class="n">2</span>Retrouve tes liens</div>
        <div class="step"><span class="n">3</span>Suis tes gains</div>
      </div>
    </div>
  </aside>

  <main class="panel">
    <div class="form-col">
      <h2>Content de te revoir</h2>

      <div class="oauth">
        <button type="button" id="googleBtn"><i class="fa-brands fa-google"></i> Google</button>
        <button type="button" disabled title="Bientôt disponible"><i class="fa-brands fa-github"></i> GitHub</button>
        <button type="button" disabled title="Bientôt disponible"><i class="fa-brands fa-discord"></i> Discord</button>
      </div>

      <div class="or">OU</div>

      <form id="f" autocomplete="on">
        <div class="field">
          <label for="u">E-mail</label>
          <div class="input"><input id="u" type="email" placeholder="Entre ton e-mail" autocomplete="email"></div>
        </div>
        <div class="field">
          <label for="p">Mot de passe <a class="forgot" href="#">Mot de passe oublié ?</a></label>
          <div class="input has-eye">
            <input id="p" type="password" placeholder="Entre ton mot de passe" autocomplete="current-password">
            <button type="button" class="eye" aria-label="Afficher le mot de passe"><i class="fa-regular fa-eye"></i></button>
          </div>
        </div>
        <div class="field">
          <div id="turnstile-login" aria-label="Vérification anti-bot"></div>
        </div>
        <div class="field">
          <button type="submit" class="submit" id="go" disabled>Se connecter <i class="fa-solid fa-arrow-right"></i></button>
        </div>
        <div class="switch">Pas encore de compte ? <a href="register.html">Créer un compte</a></div>
        <div class="switch sm">Tu n'as pas reçu l'e-mail d'activation ? <a class="w" href="#">Renvoyer l'e-mail</a></div>
      </form>
    </div>
  </main>

</div>
<script>
const u=document.getElementById('u'),p=document.getElementById('p');
const form=document.getElementById('f');
const go=document.getElementById('go');
let turnstileToken='', turnstileWidgetId=null;

const check=()=>{go.disabled=!(u.value.trim()&&p.value&&turnstileToken)};
u.addEventListener('input',check);p.addEventListener('input',check);

document.querySelector('.eye').addEventListener('click',e=>{
  const b=e.currentTarget,show=p.type==='password';
  p.type=show?'text':'password';
  b.innerHTML='<i class="fa-regular fa-eye'+(show?'-slash':'')+'"></i>';
});

function renderTurnstile(){
  if(!window.turnstile){setTimeout(renderTurnstile,150);return;}
  turnstileWidgetId=window.turnstile.render('#turnstile-login',{ 
    sitekey:'0x4AAAAAAGRAl9vpVVIGbDub',
    callback(token){turnstileToken=token;check();},
    'expired-callback':()=>{turnstileToken='';check();},
    'error-callback':()=>{turnstileToken='';check();}
  });
}
renderTurnstile();

form.addEventListener('submit',async e=>{
  e.preventDefault();
  if(!turnstileToken){alert('Veuillez terminer la vérification Turnstile.');return;}
  go.disabled=true;
  const original=go.innerHTML;
  go.innerHTML='Connexion…';
  try{
    const result=await apiRequest('/auth/login',{method:'POST',body:JSON.stringify({email:u.value.trim(),password:p.value,turnstileToken})});
    Auth.setToken(result.token);Auth.setUser(result.user);
    window.location.href='/dashboard/dashboard.html';
  }catch(error){
    alert(error.message || 'Impossible de se connecter');
    turnstileToken='';
    if(window.turnstile&&turnstileWidgetId!==null)window.turnstile.reset(turnstileWidgetId);
  }finally{go.innerHTML=original;check();}
});

// Connexion Google OAuth
document.getElementById('googleBtn').addEventListener('click', () => {
  window.location.href = 'https://api.clikpay.fr/auth/google';
});
</script>
</body>
</html>
